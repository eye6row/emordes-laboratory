<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Editor / EMORDES LABORATORY</title>
<script>try{if(localStorage.getItem("izlab-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}
</script><style>
:root{--bg:#fff;--bg2:#F4F5F6;--ink:#111;--mut:#8a8d91;--line:rgba(17,17,17,.1);--r:22px;--ease:cubic-bezier(.2,.9,.1,1);--f:"Helvetica Neue",Helvetica,Arial,sans-serif;--bar:64px;--ok:#1a7f37;--bad:#c4321f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 12px/1.45 var(--f);letter-spacing:.01em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.bar{position:sticky;top:0;height:var(--bar);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;z-index:20;background:rgba(255,255,255,.75);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.25}.brand b{font-weight:700;letter-spacing:.04em}.brand span{color:var(--mut)}
.acts{display:flex;align-items:center;gap:10px}
.pill{border:1px solid var(--line);border-radius:99px;padding:8px 14px;background:var(--bg);transition:background .2s,border-color .2s}
.pill:hover{border-color:var(--ink)}.pill.dark{background:var(--ink);color:#fff;border-color:var(--ink)}.pill.dark:hover{background:#333}
.pill:disabled{opacity:.4;cursor:default}
#status{color:var(--mut);max-width:44vw;text-align:right}#status.ok{color:var(--ok)}#status.bad{color:var(--bad)}
/* login */
.login{min-height:100svh;display:grid;place-items:center;padding:22px}
.login form{width:min(340px,100%);display:grid;gap:12px;padding:28px;border-radius:var(--r);background:rgba(244,245,246,.8);border:1px solid var(--line)}
.login h1{font-size:12px;font-weight:700;letter-spacing:.04em}.login p{color:var(--mut)}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:0;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--ink)}textarea{resize:vertical;min-height:96px}
.err{color:var(--bad);min-height:1em}
/* app */
.app{display:grid;grid-template-columns:300px 1fr;min-height:calc(100svh - var(--bar))}
.list{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:var(--bar);height:calc(100svh - var(--bar));overflow:auto}
.list .h{display:flex;justify-content:space-between;align-items:center;color:var(--mut);padding:2px 4px 8px}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:6px;border-radius:14px;cursor:pointer;text-align:left;width:100%}
.item:hover{background:var(--bg2)}.item.on{background:var(--ink);color:#fff}.item.on small{color:#bbb}
.item .th{width:40px;height:40px;border-radius:10px;background:var(--bg2) center/cover;display:grid;place-items:center;font-size:9px;color:var(--mut);overflow:hidden}
.item small{display:block;color:var(--mut)}.item b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{display:flex;flex-direction:column}.mv button{width:22px;height:18px;border-radius:6px;line-height:1}.mv button:hover{background:rgba(127,127,127,.2)}
.ed{padding:22px 28px 80px;max-width:980px}
.ed .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px}
.ed h2{font-size:22px;font-weight:500;letter-spacing:-.01em}.ed h2 span{color:var(--mut);margin-right:10px;font-size:12px;vertical-align:middle}
.cols{display:grid;grid-template-columns:280px 1fr;gap:28px}
.photo{aspect-ratio:1;border-radius:var(--r);background:var(--bg2) center/cover;position:relative;overflow:hidden;display:grid;place-items:center;color:var(--mut);border:1px dashed var(--line)}
.photo.has{border-style:solid}
.photo label{position:absolute;inset:auto 10px 10px;text-align:center;cursor:pointer;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:99px;padding:8px;color:var(--ink)}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f{display:grid;gap:5px}.f.w{grid-column:1/-1}.f>span{color:var(--mut)}
.recs{display:grid;gap:10px}.rb{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px}.rh{display:grid;grid-template-columns:1fr 26px 26px 28px;gap:6px}.rt{font-weight:600}.mvb{border-radius:8px}.mvb:disabled{opacity:.3}.rec{display:grid;gap:6px}.rrow{display:grid;grid-template-columns:1fr 1fr 28px;gap:6px}
.x{border-radius:8px;color:var(--mut)}.x:hover{color:var(--bad);background:var(--bg2)}
.add{justify-self:start;color:var(--mut);padding:4px 0}.add:hover{color:var(--ink)}
.del{color:var(--bad)}
.dirty{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:middle}
/* fields */
.flds{display:grid;gap:8px}.fr{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.fr.off{opacity:.5}.fr.drag{opacity:.3}.fr.over{outline:1.5px solid var(--ink);outline-offset:2px}
.hd{cursor:grab;color:var(--mut);letter-spacing:-2px;padding-top:9px;user-select:none}
.fm{display:grid;gap:6px;min-width:0}.ft{display:flex;gap:8px;align-items:center}.fl{font-weight:600}.fl:disabled{opacity:.7}
.tag{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.tag.c{color:var(--ok)}
.fv.mut{color:var(--mut);padding:2px 0}.fvi{min-height:0}
.fc{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.fc select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--bg);font:inherit;color:inherit}
.fc .mvb{width:28px;height:28px}.hz{display:flex;gap:5px;align-items:center;color:var(--mut);margin-right:auto}.hz input{width:auto}
.pv{margin-top:10px;padding:12px;border-radius:12px;background:var(--bg2);color:var(--mut)}.pv b{font-weight:500;color:var(--ink)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.pg>div{border:1px dashed var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pg small{width:100%;font-size:9px;text-transform:uppercase;letter-spacing:.06em}.pg i{font-style:normal;background:var(--bg);color:var(--ink);border-radius:99px;padding:2px 8px}.pg em{font-style:normal;opacity:.6}
.pw{grid-column:1/-1}.ph2{justify-content:center;min-height:34px;background:var(--line)}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.gc{display:flex;flex-direction:column;gap:5px;min-width:0}.gcap{width:100%;resize:vertical;min-height:38px;font:inherit;font-size:11px;line-height:1.35;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit}.gcap:focus{outline:none;border-color:var(--ink)}
.g{position:relative;aspect-ratio:1;border-radius:14px;background:var(--bg2) center/cover;border:1px solid var(--line);cursor:grab;overflow:hidden}
.g.drag{opacity:.35}.g.over{outline:1.5px solid var(--ink);outline-offset:2px}
.g .cv{position:absolute;left:6px;top:6px;font-size:9px;letter-spacing:.06em;background:var(--ink);color:#fff;border-radius:99px;padding:2px 7px}
.g .gb{position:absolute;inset:auto 4px 4px;display:flex;justify-content:space-between;gap:2px}
.g .gb button{width:24px;height:24px;border-radius:99px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:11px;line-height:1}
.g .gb button:hover{background:#fff}.g .gb .x:hover{color:var(--bad)}
.ghint{color:var(--mut);margin-top:8px}
/* crop */
.rqf{display:grid;gap:8px}.rqf textarea{width:100%;resize:vertical;font:inherit;font-size:12px;padding:8px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit}.rqtag{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mut)}
.rq{border-top:1px solid var(--line);padding:8px 0;font-size:11.5px;display:grid;gap:4px}.rq p{white-space:pre-wrap;margin:0;color:var(--ink)}.rqh{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:10px}.rqh b{font-weight:600;padding:1px 6px;border-radius:99px;border:1px solid var(--line)}.rqh b.done{background:var(--ink);color:var(--bg,#fff)}.rqh button{margin-left:auto;border:0;background:none;color:var(--mut);cursor:pointer;font-size:11px}.rqr{color:var(--mut);border-left:2px solid var(--line);padding-left:8px}.rqsb{margin-top:10px;width:100%}
.cropbtn{margin-top:10px;width:100%}.gcrop{padding:4px 8px;font-size:10px;align-self:flex-start}
.cm{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(17,17,17,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cbox{width:min(420px,100%);display:grid;gap:14px;padding:18px;border-radius:var(--r);background:#fff;border:1px solid var(--line)}
.cbox h3{font-size:12px;font-weight:700;letter-spacing:.04em}.cbox p{color:var(--mut)}
.cv2{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--bg2);cursor:grab;touch-action:none;user-select:none}
.cv2.on{cursor:grabbing}.cv2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.cv2::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.5) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.5) 66.6%,transparent 66.8%),linear-gradient(transparent 33.2%,rgba(255,255,255,.5) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.5) 66.6%,transparent 66.8%)}
.zr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;color:var(--mut)}.zr input{padding:0;accent-color:var(--ink)}
.cacts{display:flex;justify-content:space-between;gap:8px}.cacts div{display:flex;gap:8px}
@media (max-width:760px){
 .bar{padding:0 14px}.brand span{display:none}#status{display:none}
 .app{grid-template-columns:1fr}.list{position:static;height:auto;max-height:42svh;border-right:0;border-bottom:1px solid var(--line)}
 .ed{padding:18px 14px 90px}.cols{grid-template-columns:1fr}.photo{max-width:320px;width:100%}
 .fields{grid-template-columns:1fr 1fr}
 .mstat{position:fixed;left:14px;right:14px;bottom:14px;z-index:30;padding:10px 14px;border-radius:99px;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);text-align:center}
}
@media (min-width:761px){.mstat{display:none}}
.mstat:empty{display:none}

.tt{color:var(--mut);padding:4px 0;font-size:inherit;text-transform:uppercase;letter-spacing:.06em;font-size:10px}.tt:hover{color:var(--ink)}
.acts .tt{margin-right:4px}
[data-theme=dark]{color-scheme:dark;--bg:#0b0b0b;--bg2:#161718;--ink:#ededed;--mut:#8b8e93;--line:rgba(237,237,237,.12)}
[data-theme=dark] .bar{background:rgba(11,11,11,.72)}
[data-theme=dark] .pill.dark,[data-theme=dark] .item.on,[data-theme=dark] .g .cv,[data-theme=dark] .filters button.on{color:#0b0b0b}
[data-theme=dark] .pill.dark:hover{background:#cfcfcf}
[data-theme=dark] .skip{color:#0b0b0b}
[data-theme=dark] .login form{background:rgba(22,23,24,.8)}
[data-theme=dark] input,[data-theme=dark] textarea{background:#121314}
[data-theme=dark] .photo label{background:rgba(18,18,18,.78)}
[data-theme=dark] .g .gb button{background:rgba(18,18,18,.85)}[data-theme=dark] .g .gb button:hover{background:#000}
[data-theme=dark] .item.on small{color:#555}
[data-theme=dark] .cm{background:rgba(0,0,0,.6)}[data-theme=dark] .cbox{background:#121314}
[data-theme=dark] .mstat{background:rgba(18,18,18,.85)}
.cats{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}.cats summary{display:flex;justify-content:space-between;cursor:pointer;color:var(--mut);list-style:none}.cats summary::-webkit-details-marker{display:none}.cats[open] summary{margin-bottom:8px;color:var(--ink)}
#clist{display:grid;gap:5px}.crow{display:grid;grid-template-columns:14px 1fr auto 26px 26px 26px;gap:5px;align-items:center}.crow small{color:var(--mut);font-variant-numeric:tabular-nums;min-width:14px;text-align:right}.crow .mvb,.crow .x{height:28px}.crow input{min-width:0}
.grip{color:var(--mut);cursor:grab;font-size:10px;letter-spacing:-2px}.crow.drag{opacity:.4}.crow.over{box-shadow:0 -2px 0 var(--ink)}
.cadd{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:8px}.cats .ghint{margin:6px 0 0}
#catSel{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font:inherit;color:inherit}
</style></head>
<body>
<section class="login" id="login" hidden>
  <form id="lf" autocomplete="on">
    <h1>EMORDES LABORATORY / Editor</h1>
    <p>Enter the password to edit samples.</p>
    <input type="password" id="pw" name="password" autocomplete="current-password" placeholder="Password" required aria-label="Password">
    <button class="pill dark" id="lb">Log in</button>
    <div class="err" id="lerr" role="alert"></div>
  </form>
</section>

<div id="appwrap" hidden>
  <header class="bar">
    <a class="brand" href="/" target="_blank" rel="noopener"><b>EMORDES LABORATORY</b><span>Editor / view live site</span></a>
    <div class="acts"><button class="tt" id="tt" type="button" aria-label="Toggle dark mode"></button><span id="status" aria-live="polite"></span>
      <button class="pill" id="out">Log out</button><button class="pill dark" id="save" disabled>Save</button></div>
  </header>
  <div class="app">
    <aside class="list"><details class="cats" id="catsBox"><summary><span>Categories</span><span id="ccnt"></span></summary><div id="clist"></div><form id="cadd" class="cadd"><input id="cnew" maxlength="60" placeholder="New category" aria-label="New category name"><button class="pill">Add</button></form><p class="ghint">Groups tiles on the home page, in this order. Empty = no groups.</p></details>
<details class="cats" id="rqBox"><summary><span>Edit requests for Kat</span><span id="rqcnt"></span></summary><form id="rqf" class="rqf"><textarea id="rqt" maxlength="2000" rows="4" placeholder="Describe a change you'd like Kat to make to the site" aria-label="Edit request"></textarea><label class="rqtag"><input type="checkbox" id="rqs"> <span id="rqsl">Tag current sample</span></label><button class="pill dark">Send request</button></form><p class="ghint" id="rqmsg">Saved to the repo. Kat replies here when done.</p><div id="rql"></div></details>
    <div class="h"><span id="cnt"></span><button class="pill" id="addS">+ Add sample</button></div><div id="items"></div></aside>
    <main class="ed" id="ed"></main>
  </div>
  <div class="mstat" id="mstat" aria-live="polite"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF=[['code','Code','l'],['fiber','Fiber','l'],['gsm','Weight','l'],['finish','Finish','l'],['origin','Origin','r'],['tags','Tags','r'],['year','Year','r'],['description','Description','r'],['recipes','Recipes','w']],ZN=[['l','Meta, left column'],['r','Meta, right column'],['w','Meta, full row'],['b','Below photos']];
function lay(x){const out=[],seen=new Set();(Array.isArray(x.fields)?x.fields:[]).forEach(f=>{if(!f||typeof f!=='object')return;const z=ZN.some(q=>q[0]===f.zone)?f.zone:null;
 if(f.key){const d=DEF.find(d=>d[0]===f.key);if(!d||seen.has(f.key))return;seen.add(f.key);out.push({key:f.key,label:f.label||d[1],zone:z||d[2],hidden:!!f.hidden})}
 else out.push({label:f.label||'',value:f.value||'',zone:z||'r',hidden:!!f.hidden})});
 DEF.forEach(d=>{if(!seen.has(d[0]))out.push({key:d[0],label:d[1],zone:d[2],hidden:false})});return out}
const pack=a=>a.map(s=>{const f=s.fields.map(x=>{const d=x.key&&DEF.find(d=>d[0]===x.key),o=x.key?{key:x.key,zone:x.zone}:{label:x.label,value:x.value,zone:x.zone};if(d&&x.label.trim()&&x.label.trim()!==d[1])o.label=x.label.trim();if(x.hidden)o.hidden=true;return o});
 const isDef=f.every((x,i)=>x.key===DEF[i]?.[0]&&x.zone===DEF[i][2]&&!x.label&&!x.hidden)&&f.length===DEF.length;const o={...s};if(isDef)delete o.fields;else o.fields=f;return o});
const norm=a=>a.map(s=>({...s,fields:lay(s),recipes:(Array.isArray(s.recipes)?s.recipes:(s.recipe&&s.recipe.length?[{title:'Recipe',rows:s.recipe}]:[])).map(q=>({title:q.title||'',rows:(q.rows||[]).map(r=>({ingredient:r.ingredient??r.item??'',amount:r.amount||''}))})),recipe:undefined,images:s.images&&s.images.length?[...s.images]:s.image?[s.image]:[],captions:{...(s.captions&&typeof s.captions==='object'?s.captions:{})},crops:{...(s.crops&&typeof s.crops==='object'?s.crops:{})}}));
let D=[],CATS=[],sha=null,sel=0,dirty=false,busy=false;
const src=p=>!p?'':/^images\/uploads\//.test(p)?'/api/img?p='+encodeURIComponent(p):'/'+p;
let mt;function status(t,c=''){const s=$('#status');s.textContent=t;s.className=c;const m=$('#mstat');m.textContent=t;clearTimeout(mt);if(!/Unsaved|…/.test(t))mt=setTimeout(()=>m.textContent=dirty?'Unsaved changes':'',3000)}
function setDirty(v=true){dirty=v;$('#save').disabled=!v||busy;if(v)status('Unsaved changes')}
async function api(path,body){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body||{})});
 const j=await r.json().catch(()=>({}));if(r.status===401&&path!=='login'){show(false);throw new Error('Session expired, log in again')}if(!r.ok)throw new Error(j.error||'Error '+r.status);return j}

async function boot(){const r=await fetch('/api/me',{cache:'no-store'});const j=await r.json();j.authed?load():show(false)}
function show(app){$('#login').hidden=app;$('#appwrap').hidden=!app;if(app)rqInit();if(!app)setTimeout(()=>$('#pw').focus(),50)}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lb').disabled=true;$('#lerr').textContent='';
 try{await api('login',{password:$('#pw').value});$('#pw').value='';await load()}catch(x){$('#lerr').textContent=x.message}finally{$('#lb').disabled=false}};
$('#out').onclick=async()=>{if(dirty&&!confirm('Discard unsaved changes?'))return;await api('logout');dirty=false;show(false)};

async function load(){status('Loading…');const r=await fetch('/api/samples?admin=1',{cache:'no-store'});if(!r.ok){status('Could not load data','bad');return}
 const j=await r.json();CATS=Array.isArray(j.categories)?[...j.categories]:[];D=norm(j.samples);sha=j.sha;sel=Math.min(sel,D.length-1);show(true);setDirty(false);status('All saved');cats();list();edit()}

function list(){$('#cnt').textContent=D.length+' samples';
 $('#items').innerHTML=D.map((s,i)=>`<div class="item${i===sel?' on':''}" data-i="${i}" role="button" tabindex="0"><span class="th" style="${(s.images[0])?`background-image:url('${esc(src(s.images[0]))}')`:''}">${s.images[0]?'':'EML'}</span><span><small>EML-${esc(s.n)}</small><b>${esc(s.title)}</b></span><span class="mv"><button data-mv="-1" aria-label="Move up">↑</button><button data-mv="1" aria-label="Move down">↓</button></span></div>`).join('')}
$('#items').onclick=e=>{const it=e.target.closest('.item');if(!it)return;const i=+it.dataset.i,m=e.target.closest('[data-mv]');
 if(m){const j=i+ +m.dataset.mv;if(j<0||j>=D.length)return;[D[i],D[j]]=[D[j],D[i]];if(sel===i)sel=j;else if(sel===j)sel=i;setDirty();list();return}
 sel=i;list();edit();if(innerWidth<761)$('#ed').scrollIntoView({behavior:'smooth'})};
function cats(){const n=CATS.length;$('#ccnt').textContent=n||'';const cnt=c=>D.filter(s=>s.category===c).length;
 $('#clist').innerHTML=CATS.map((c,i)=>`<div class="crow" data-i="${i}" draggable="true"><span class="grip" aria-hidden="true">⋮⋮</span><input value="${esc(c)}" maxlength="60" aria-label="Category name"><small>${cnt(c)}</small><button class="mvb" data-m="-1" ${i?'':'disabled'} aria-label="Move up">↑</button><button class="mvb" data-m="1" ${i<n-1?'':'disabled'} aria-label="Move down">↓</button><button class="x" aria-label="Delete category">✕</button></div>`).join('');
 $('#clist').querySelectorAll('.crow').forEach(r=>{const i=+r.dataset.i,inp=r.querySelector('input');
  inp.onchange=()=>{const v=inp.value.trim().slice(0,60),old=CATS[i];if(!v||CATS.some((c,k)=>k!==i&&c.toLowerCase()===v.toLowerCase())){inp.value=old;if(v)alert('That category already exists.');return}

async function decode(file){
 try{return await createImageBitmap(file)}catch{}
 try{const u=URL.createObjectURL(file);const im=new Image();im.src=u;await im.decode();return im}catch{}
 if(/hei[cf]/i.test(file.type)||/\.hei[cf]$/i.test(file.name)){status('Converting HEIC…');
  if(!window.heic2any)await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
  const b=await heic2any({blob:file,toType:'image/jpeg',quality:.9});return createImageBitmap(Array.isArray(b)?b[0]:b)}
 throw new Error('Could not read that image')}

  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  let q=.86,data=c.toDataURL('image/jpeg',q);while(data.length>3.6e6&&q>.5){q-=.1;data=c.toDataURL('image/jpeg',q)}
  status(`Uploading photo ${done+1} of ${files.length}…`);const j=await api('upload',{data});if(!s.images.includes(j.path))s.images.push(j.path);s.image=s.images[0];done++}

  try{RQ=await rqApi({action:'add',text:t,sample:$('#rqs').checked?rqCode():''});$('#rqt').value='';$('#rqs').checked=false;$('#rqmsg').textContent='Sent. Kat replies here when done.';rqDraw()}catch(err){$('#rqmsg').textContent='Error: '+err.message}btn.disabled=false};
 $('#rql').onclick=async e=>{const d=e.target.closest('button[data-id]');if(!d||!confirm('Delete this request?'))return;try{RQ=await rqApi({action:'delete',id:d.dataset.id});rqDraw()}catch(err){alert(err.message)}}}
</script>
<script>(function(){var b=document.getElementById("tt"),r=document.documentElement;function s(){var d=r.dataset.theme==="dark";b.textContent=d?"Light":"Dark";b.setAttribute("aria-pressed",d)}s();b.onclick=function(){var d=r.dataset.theme!=="dark";if(d)r.dataset.theme="dark";else delete r.dataset.theme;try{localStorage.setItem("izlab-theme",d?"dark":"light")}catch(e){}s()}})();</script>
